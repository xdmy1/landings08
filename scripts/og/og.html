<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>og</title>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --ink: #0f0f0e;
    --ink-2: #50504a;
    --ink-3: #6b6b64;
    --line: #e2e1d8;
    --orange: #ff3000;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body {
    position: relative;
    font-family: "Switzer", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* header: mark + wordmark, then the H1 and one supporting line */
  .head {
    position: absolute; left: 0; right: 0; top: 54px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { height: 40px; width: auto; display: block; }
  .brand span { font-size: 38px; font-weight: 500; letter-spacing: -0.025em; line-height: 1; }
  .rule { width: 56px; height: 1px; background: var(--line); margin: 26px 0 22px; }
  h1 { font-size: 46px; font-weight: 500; letter-spacing: -0.03em; line-height: 1; }
  h1 em { font-style: normal; color: var(--orange); }
  .sub { margin-top: 14px; font-size: 21px; font-weight: 400; color: var(--ink-2); letter-spacing: -0.005em; }
  .sub i { font-style: normal; color: var(--line); margin: 0 12px; }

  /* five phones, center one raised, all cut by the bottom edge */
  .row {
    position: absolute; left: 0; right: 0; top: 262px;
    display: flex; justify-content: center; gap: 30px;
  }
  .phone {
    position: relative; width: 198px; height: 428px; flex: none;
    border-radius: 34px; padding: 7px;
    background: linear-gradient(180deg, #3a3a3d 0%, #1b1b1d 45%, #131315 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.08),
      0 1px 2px rgba(15,15,14,.18),
      0 34px 60px -26px rgba(15,15,14,.42);
  }
  .phone:nth-child(1), .phone:nth-child(5) { margin-top: 40px; }
  .phone:nth-child(2), .phone:nth-child(4) { margin-top: 18px; }
  .screen {
    position: relative; width: 100%; height: 100%;
    border-radius: 28px; overflow: hidden; background: #fff;
  }
  .screen img { display: block; width: 100%; height: auto; }
  .bar {
    height: 22px; padding: 0 20px 0 22px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 8.5px; font-weight: 600; letter-spacing: 0.01em; line-height: 1;
  }
  .bar.dark { color: #fff; }
  .bar.light { color: #0f0f0e; }
  .ic { display: flex; align-items: center; gap: 3px; }
  .sig { display: flex; align-items: flex-end; gap: 1px; height: 7px; }
  .sig b { display: block; width: 1.6px; background: currentColor; border-radius: 0.5px; }
  .bat { position: relative; width: 14px; height: 7px; border: 1px solid currentColor; border-radius: 2px; opacity: .95; }
  .bat::before { content: ""; position: absolute; inset: 1px; right: 3px; background: currentColor; border-radius: 1px; }
  .bat::after { content: ""; position: absolute; right: -3px; top: 1.5px; width: 1.5px; height: 3px; background: currentColor; border-radius: 0 1px 1px 0; opacity: .5; }
  .island {
    position: absolute; left: 50%; top: 8px; transform: translateX(-50%);
    width: 60px; height: 17px; border-radius: 9px; background: #000; z-index: 2;
  }
  .k { position: absolute; width: 3px; border-radius: 1.5px; background: #262628; }
  .k.mute { left: -3px; top: 92px; height: 22px; }
  .k.up { left: -3px; top: 132px; height: 42px; }
  .k.down { left: -3px; top: 184px; height: 42px; }
  .k.pow { right: -3px; top: 146px; height: 66px; }
</style>
</head>
<body>
  <div class="head">
    <div class="brand">
      <img src="../../public/images/logo.png" alt="">
      <span>landings.md</span>
    </div>
    <div class="rule"></div>
    <h1>Site-uri care aduc <em>clienți.</em></h1>
    <p class="sub">Studio din Chișinău<i>·</i>Site-uri, aplicații și SEO<i>·</i>Scrise de la zero</p>
  </div>

  <div class="row">
    <div class="phone"><span class="k mute"></span><span class="k up"></span><span class="k down"></span><span class="k pow"></span><span class="island"></span>
      <div class="screen">
        <div class="bar light" style="background:#f5f6f8"><span>9:41</span><span class="ic"><span class="sig"><b style="height:3px"></b><b style="height:4.5px"></b><b style="height:6px"></b><b style="height:7px"></b></span><span class="bat"></span></span></div>
        <img src="shots/glg.png" alt="">
      </div>
    </div>
    <div class="phone"><span class="k mute"></span><span class="k up"></span><span class="k down"></span><span class="k pow"></span><span class="island"></span>
      <div class="screen">
        <div class="bar dark" style="background:#252525"><span>9:41</span><span class="ic"><span class="sig"><b style="height:3px"></b><b style="height:4.5px"></b><b style="height:6px"></b><b style="height:7px"></b></span><span class="bat"></span></span></div>
        <img src="shots/eurogard.png" alt="">
      </div>
    </div>
    <div class="phone"><span class="k mute"></span><span class="k up"></span><span class="k down"></span><span class="k pow"></span><span class="island"></span>
      <div class="screen">
        <div class="bar light" style="background:#ffffff"><span>9:41</span><span class="ic"><span class="sig"><b style="height:3px"></b><b style="height:4.5px"></b><b style="height:6px"></b><b style="height:7px"></b></span><span class="bat"></span></span></div>
        <img src="shots/davo.png" alt="">
      </div>
    </div>
    <div class="phone"><span class="k mute"></span><span class="k up"></span><span class="k down"></span><span class="k pow"></span><span class="island"></span>
      <div class="screen">
        <div class="bar dark" style="background:#16191d"><span>9:41</span><span class="ic"><span class="sig"><b style="height:3px"></b><b style="height:4.5px"></b><b style="height:6px"></b><b style="height:7px"></b></span><span class="bat"></span></span></div>
        <img src="shots/radx.png" alt="">
      </div>
    </div>
    <div class="phone"><span class="k mute"></span><span class="k up"></span><span class="k down"></span><span class="k pow"></span><span class="island"></span>
      <div class="screen">
        <div class="bar light" style="background:#ece9e2"><span>9:41</span><span class="ic"><span class="sig"><b style="height:3px"></b><b style="height:4.5px"></b><b style="height:6px"></b><b style="height:7px"></b></span><span class="bat"></span></span></div>
        <img src="shots/interbus.png" alt="">
      </div>
    </div>
  </div>
</body>
</html>
